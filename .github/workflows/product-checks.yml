name: Product management checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/admin-product-editor]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: motif_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: motif_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U motif_test -d motif_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://motif_test:local_test_only@127.0.0.1:5432/motif_test
      ADMIN_TOKEN: local-test-admin-only
      PORT: 4187
      CHROME_BIN: /usr/bin/google-chrome
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: google-chrome --version
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx prisma db execute --file db/add-site-content.sql --schema prisma/schema.prisma
      - run: npx prisma db execute --file db/add-site-content.sql --schema prisma/schema.prisma
      - run: npx prisma db execute --file db/add-guest-checkout.sql --schema prisma/schema.prisma
      - run: npx prisma db execute --file db/add-card-transfer.sql --schema prisma/schema.prisma
      - run: npx prisma db execute --file db/add-order-tracking.sql --schema prisma/schema.prisma
      - run: npx prisma db execute --file db/add-zibal-attempt.sql --schema prisma/schema.prisma
      - run: node --test test/*.test.js
      - run: MOTIF_SESSION_TEST_DB=1 node --test test/admin-session.test.js
      - run: node scripts/verify-admin-release.cjs --skip-storage
      - run: node test/product-integration.cjs
      - run: node test/zibal-reconciliation.cjs
      - run: node test/structure-integration.cjs
      - run: PATH=/usr/lib/postgresql/16/bin:$PATH bash test/migration-restore.sh

  checkout-schema-18:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    services:
      postgres18:
        image: postgres:18.4
        env:
          POSTGRES_USER: motif_schema_test
          POSTGRES_PASSWORD: local_schema_fixture_only
          POSTGRES_DB: motif_schema_test
        options: >-
          --health-cmd "pg_isready -U motif_schema_test -d motif_schema_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify checkout DDL and backup restore on PostgreSQL 18.4
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres18.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" mkdir -p /tmp/motif-schema-source
          docker cp prisma "$POSTGRES_CONTAINER:/tmp/motif-schema-source/prisma"
          docker cp db "$POSTGRES_CONTAINER:/tmp/motif-schema-source/db"
          docker cp test/checkout-schema-restore.sh "$POSTGRES_CONTAINER:/tmp/checkout-schema-restore.sh"
          docker exec -e PGHOST=127.0.0.1 -e PGUSER=motif_schema_test -e PGPASSWORD=local_schema_fixture_only -e PGDATABASE=motif_schema_test "$POSTGRES_CONTAINER" bash /tmp/checkout-schema-restore.sh
