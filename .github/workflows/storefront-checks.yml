name: Storefront checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/motif-storefront]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node test/storefront.cjs
      - run: node test/measurement-browser.cjs
      - run: node test/upload-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storefront-previews
          path: /tmp/motif-*.png
