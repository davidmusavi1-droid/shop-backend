name: Zibal retry checks
on:
  pull_request:
    branches: [main]
    paths: ['src/lib/*retry*', 'src/lib/zibal-live.js', 'src/lib/checkout-access.js', 'src/lib/payment-result.js', 'src/routes/checkout.js', 'src/routes/payment.js', 'prisma/schema.prisma', 'db/add-zibal-retries.sql', 'db/add-destination-shipping.sql', 'src/lib/destination-shipping.js', 'test/destination-shipping*', 'test/zibal-retry*', '.github/workflows/zibal-retry-checks.yml']
permissions:
  contents: read
jobs:
  retry-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: motif_retry
          POSTGRES_PASSWORD: retry_fixture_only
          POSTGRES_DB: motif_retry
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U motif_retry -d motif_retry"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://motif_retry:retry_fixture_only@127.0.0.1:5432/motif_retry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npx prisma migrate deploy
      - name: Install isolated checkout fixture schema
        run: |
          for script in add-guest-checkout add-card-transfer add-order-tracking add-zibal-attempt add-zibal-retries; do
            npx prisma db execute --file "db/$script.sql" --schema prisma/schema.prisma
          done
          npx prisma db execute --file db/add-zibal-retries.sql --schema prisma/schema.prisma
      - run: node --test test/zibal-retry-policy.test.js
      - run: node test/zibal-retry-postgres.cjs
      - name: Status-2 callback regression (Express and isolated PostgreSQL)
        run: node test/zibal-retry-status2-postgres.cjs

      - run: npm install --no-save --no-package-lock playwright@1.56.1
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - name: Install isolated destination shipping schema
        run: |
          npx prisma db execute --file db/add-destination-shipping.sql --schema prisma/schema.prisma
          npx prisma db execute --file db/add-destination-shipping.sql --schema prisma/schema.prisma
      - run: node --test test/destination-shipping.test.js
      - run: node test/destination-shipping-postgres.cjs
      - name: Public checkout access and final inquiry (isolated only)
        run: node test/zibal-retry-public-postgres.cjs
        env:
          MOTIF_PUBLIC_BROWSER_TEST: 'true'
          CHROME_BIN: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-public-checkout-evidence
          path: artifacts/public-checkout-*.png
          if-no-files-found: ignore
