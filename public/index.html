<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#181818"><title>MOTIF | پوشاک برای هر روز</title>
<style>
:root{--ink:#181818;--paper:#f5f3ed;--red:#ab332c;--line:#d9d6cd}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.9 Tahoma,sans-serif}a{color:inherit;text-decoration:none}button,input,select{font:inherit}button,a,input,select{touch-action:manipulation}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--red);outline-offset:4px}[hidden]{display:none!important}.wrap{max-width:1200px;margin:auto;padding:0 24px}header{border-bottom:1px solid var(--line)}.head{height:88px;display:flex;align-items:center;justify-content:space-between}.logo{font:bold 34px Arial;letter-spacing:5px}.muted{color:#65635e}.hero{background:var(--ink);color:white;position:relative;overflow:hidden;padding:64px 40px;margin:28px 0 40px}.hero:after{content:'';position:absolute;left:-40px;top:-100px;width:400px;height:400px;opacity:.2;transform:rotate(45deg);background:repeating-linear-gradient(0deg,transparent 0 28px,#d77d69 29px 32px),repeating-linear-gradient(90deg,transparent 0 28px,#d77d69 29px 32px)}.hero>*{position:relative;z-index:1}.eyebrow{font:12px Arial;letter-spacing:3px;color:#d49a8e}h1{font-size:clamp(26px,4vw,46px);margin:12px 0}h2{font-size:25px}h3{font-size:16px}.hero p{color:#ccc;max-width:560px}.hero a{display:inline-block;border-bottom:1px solid #d49a8e;margin-top:12px}.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:14px;margin:24px 0}label{display:block;font-size:13px}input,select{width:100%;background:transparent;border:1px solid #aaa69b;border-radius:0;padding:12px;margin-top:6px;min-width:0}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px 20px}.card{display:block;min-width:0}.photo{background:#e9e6df;aspect-ratio:4/5;display:grid;place-items:center;overflow:hidden;color:#777;position:relative}.photo img{width:100%;height:100%;object-fit:contain}.card h3{margin:12px 0 4px}.card p{margin:4px 0}.card .sizes{font-size:12px;color:#65635e}.tag{font-size:11px;color:var(--red)}.state{padding:48px 20px;text-align:center;border:1px solid var(--line);margin:20px 0}.button{padding:10px 18px;border:1px solid var(--ink);background:transparent;color:var(--ink)}.back{display:inline-block;margin:26px 0}.detail{display:grid;grid-template-columns:1.1fr 1fr;gap:48px}.detail h1{font-size:30px;line-height:1.7}.thumbs{display:flex;gap:8px;overflow:auto;margin-top:10px}.thumbs button{padding:0;flex:0 0 68px;border:1px solid var(--line);background:transparent}.thumbs img{width:66px;height:78px;object-fit:contain}.choices{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 22px}.choices button{padding:10px 16px;background:transparent;border:1px solid #888}.choices button[aria-pressed=true]{background:var(--ink);color:white}.price{font-size:24px;margin:12px 0}.facts{border-top:1px solid var(--line);padding-top:16px}.fact{display:flex;gap:20px;justify-content:space-between;border-bottom:1px solid var(--line);padding:10px 0}.fact span{white-space:pre-wrap;overflow-wrap:anywhere}details{border-top:1px solid var(--line);padding:18px 0}summary{cursor:pointer;font-weight:bold}.copy{white-space:pre-wrap;overflow-wrap:anywhere}.note{background:#e9e6df;padding:16px;font-size:13px}footer{margin-top:70px;padding:30px 0;border-top:1px solid var(--line);font-size:12px;display:flex;justify-content:space-between;gap:16px}.status{min-height:24px} @media(max-width:700px){.wrap{padding:0 16px}.head{height:72px}.head .muted{font-size:11px}.hero{padding:36px 22px;margin-top:16px}.hero:after{left:-230px}.filters{grid-template-columns:1fr 1fr}.filters label:first-child{grid-column:1/-1}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 12px}.detail{grid-template-columns:1fr;gap:20px}.detail h1{font-size:25px}.logo{font-size:28px}.card h3{font-size:14px}.card p{font-size:13px}footer{flex-wrap:wrap}}
</style></head><body>
<header><div class="wrap head"><a href="#" class="logo" aria-label="صفحه اصلی موتیف" dir="ltr">MOTIF</a><span class="muted">انتخاب‌هایی برای هر روز</span></div></header>
<main class="wrap" id="main"><section id="catalog"><div class="hero"><span class="eyebrow">EVERYDAY, WITH CHARACTER</span><h1>لباس روزمره،<br>با هویت خودت.</h1><p>از انتخاب سایز شروع کن؛ جزئیات، اندازه‌ها و وضعیت هر آیتم را پیش از انتخاب ببین.</p><a href="#collection">دیدن مجموعه ↓</a></div>
<div id="collection" class="section-head"><h2>مجموعهٔ موتیف</h2><span id="count" class="muted"></span></div>
<div class="filters"><label>جست‌وجو<input id="search" type="search" placeholder="نام، برند یا مدل محصول"></label><label>سایز شما<select id="size"><option value="">همهٔ سایزها</option></select></label><label>برای چه نیازی؟<select id="need"><option value="">همهٔ کاربردها</option></select></label></div>
<div id="catalogStatus" class="state" role="status">در حال دریافت مجموعه…</div><button id="retry" class="button" hidden>تلاش دوباره</button><div id="products" class="grid"></div></section>
<section id="product" hidden><a class="back" href="#collection">← بازگشت به مجموعه</a><div id="productStatus" role="status" class="state"></div><button id="detailRetry" class="button" hidden>تلاش دوباره</button><div id="detail" class="detail" hidden></div></section>
<footer><span class="logo" dir="ltr">MOTIF</span><span class="muted">پوشاک روزمره · جزئیات هر آیتم، روشن و دقیق</span></footer></main>
<script>
'use strict';
const $=id=>document.getElementById(id), money=n=>Number(n).toLocaleString('fa-IR')+' تومان';
const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!=null)n.textContent=text;if(cls)n.className=cls;return n;};
let products=[],requestId=0;
const available=p=>(p.variants||[]).filter(v=>v.stock>0);
const normalize=s=>String(s||'').replace(/ي/g,'ی').replace(/ك/g,'ک').toLocaleLowerCase().trim();
function safeImages(values){return [...new Set((values||[]).filter(v=>{try{return new URL(v).protocol==='https:';}catch{return false;}}))];}
function picture(url,title){const box=el('div',null,'photo');const missing=()=>box.replaceChildren(el('span','تصویر ثبت نشده'));if(!url){missing();return box;}const img=el('img');img.alt=title;img.loading='lazy';img.src=url;img.onerror=missing;box.append(img);return box;}
function options(id,values){const select=$(id),previous=select.value;select.replaceChildren(select.options[0]);for(const v of [...new Set(values.filter(Boolean))].sort((a,b)=>a.localeCompare(b,'fa',{numeric:true}))){const o=el('option',v);o.value=v;select.append(o);}select.value=values.includes(previous)?previous:'';}
function renderCatalog(){const q=normalize($('search').value),size=$('size').value,need=$('need').value;const shown=products.filter(p=>normalize([p.title,p.brand,p.modelName].join(' ')).includes(q)&&(!size||available(p).some(v=>v.size===size))&&(!need||(p.customerNeeds||[]).includes(need)));$('products').replaceChildren();$('count').textContent=shown.length.toLocaleString('fa-IR')+' محصول';$('catalogStatus').hidden=!!shown.length;$('catalogStatus').textContent=products.length?'محصولی با این انتخاب پیدا نشد؛ فیلترها را تغییر دهید.':'فعلاً محصول موجودی در مجموعه نیست.';for(const p of shown){const variants=available(p).filter(v=>!size||v.size===size),prices=variants.map(v=>p.basePrice+v.priceDelta);const a=el('a',null,'card');a.href='#product/'+encodeURIComponent(p.id);a.append(picture(safeImages([...(p.images||[]),...variants.flatMap(v=>v.itemImages||[])])[0],p.title));if(p.brand)a.append(el('span',p.brand,'tag'));a.append(el('h3',p.title),el('p',(new Set(prices).size>1?'از ':'')+money(Math.min(...prices))),el('p','سایزهای موجود: '+[...new Set(variants.map(v=>v.size))].join(' · '),'sizes'));$('products').append(a);}}
async function loadCatalog(){$('retry').hidden=true;$('catalogStatus').hidden=false;$('catalogStatus').textContent='در حال دریافت مجموعه…';try{const r=await fetch('/api/products',{cache:'no-store'});if(!r.ok)throw Error();const data=await r.json();if(!Array.isArray(data))throw Error();products=data.filter(p=>p.isActive&&available(p).length);options('size',products.flatMap(p=>available(p).map(v=>v.size)));options('need',products.flatMap(p=>p.customerNeeds||[]));renderCatalog();}catch{$('products').replaceChildren();$('count').textContent='';$('catalogStatus').hidden=false;$('catalogStatus').textContent='دریافت محصولات ناموفق بود. دوباره تلاش کنید.';$('retry').hidden=false;}}
const grades={N:'نو',A_PLUS:'در حد نو',A:'تمیز',B:'آثار استفاده',C:'دارای ایراد'};
const measurements=[['chestWidthCm','عرض سینه'],['lengthCm','قد لباس'],['waistCm','دور کمر'],['riseCm','فاق'],['totalLengthCm','قد شلوار'],['thighWidthCm','عرض ران'],['hemWidthCm','عرض دمپا']];
function fact(root,label,value){if(value===null||value===undefined||value==='')return;const row=el('div',null,'fact');row.append(el('span',label),el('span',value));root.append(row);}
function renderDetail(p){const root=$('detail');root.replaceChildren();const gallery=el('div'),mainImage=el('div'),thumbs=el('div',null,'thumbs');gallery.append(mainImage,thumbs);const info=el('div');info.append(el('span',[p.brand,p.modelName].filter(Boolean).join(' / '),'tag'),el('h1',p.title));if(p.description)info.append(el('p',p.description,'copy'));const price=el('p',null,'price');price.setAttribute('aria-live','polite');info.append(price,el('h3','سایز و آیتم را انتخاب کنید'));const choices=el('div',null,'choices'),facts=el('div',null,'facts');info.append(choices,facts);const buttons=[];
function select(v){buttons.forEach(([b,item])=>b.setAttribute('aria-pressed',String(item.id===v.id)));price.textContent=money(p.basePrice+v.priceDelta);facts.replaceChildren();fact(facts,'موجودی',v.stock.toLocaleString('fa-IR')+' عدد');fact(facts,'کیفیت',grades[v.itemGrade||p.qualityGrade]||'ثبت نشده');fact(facts,'وضعیت',v.itemCondition||p.condition);fact(facts,'ایراد اعلام‌شده',v.itemDefect||p.defect||'اطلاعاتی ثبت نشده');let measured=false;for(const [key,label] of measurements)if(v[key]!=null){fact(facts,label,Number(v[key]).toLocaleString('fa-IR')+' سانتی‌متر');measured=true;}if(!measured)fact(facts,'اندازه‌های واقعی','هنوز ثبت نشده');const images=safeImages([...(v.itemImages||[]),...(p.images||[])]);mainImage.replaceChildren(picture(images[0],p.title));thumbs.replaceChildren();images.forEach((src,i)=>{const b=el('button');b.type='button';b.setAttribute('aria-label','نمایش تصویر '+(i+1));const img=el('img');img.alt='تصویر '+(i+1);img.src=src;img.onerror=()=>b.remove();b.append(img);b.onclick=()=>mainImage.replaceChildren(picture(src,p.title));thumbs.append(b);});}
for(const v of p.variants){const b=el('button',v.size+' · '+v.color+(v.stock>0?'':' · ناموجود'));b.type='button';b.disabled=v.stock<=0;b.setAttribute('aria-pressed','false');b.onclick=()=>select(v);buttons.push([b,v]);choices.append(b);}const first=available(p).find(v=>v.size===$('size').value)||available(p)[0];select(first);const identity=[['identityOrigin','خاستگاه'],['identityHistory','تاریخچه'],['identityPurpose','هدف طراحی'],['identityUseCases','کاربردها'],['identityDesign','جزئیات طراحی'],['identityTechnical','ویژگی‌های فنی'],['identitySources','منابع']].filter(([key])=>p[key]);if(identity.length){const details=el('details');details.append(el('summary','هویت و داستان محصول'));for(const [key,label] of identity){details.append(el('h3',label),el('p',p[key],'copy'));}info.append(details);}info.append(el('p','خرید آنلاین هنوز فعال نشده است. فعلاً می‌توانید محصولات و مشخصات آن‌ها را بررسی کنید.','note'));root.append(gallery,info);}
async function route(){const ticket=++requestId,match=location.hash.match(/^#product\/(.+)$/);$('catalog').hidden=!!match;$('product').hidden=!match;document.title='MOTIF | پوشاک برای هر روز';if(!match)return;$('detail').hidden=true;$('detailRetry').hidden=true;$('productStatus').hidden=false;$('productStatus').textContent='در حال دریافت مشخصات…';try{const id=decodeURIComponent(match[1]);const r=await fetch('/api/products/'+encodeURIComponent(id),{cache:'no-store'});if(ticket!==requestId)return;if(r.status===404){$('productStatus').textContent='این محصول دیگر موجود یا قابل نمایش نیست.';return;}if(!r.ok)throw Error();const p=await r.json();if(ticket!==requestId)return;if(!p.isActive||!available(p).length){$('productStatus').textContent='این محصول دیگر موجود یا قابل نمایش نیست.';return;}renderDetail(p);$('detail').hidden=false;$('productStatus').hidden=true;document.title=p.title+' | MOTIF';window.scrollTo(0,0);}catch{if(ticket!==requestId)return;$('productStatus').textContent='دریافت مشخصات ناموفق بود. دوباره تلاش کنید.';$('detailRetry').hidden=false;}}
$('search').oninput=renderCatalog;$('size').onchange=renderCatalog;$('need').onchange=renderCatalog;$('retry').onclick=loadCatalog;$('detailRetry').onclick=route;window.addEventListener('hashchange',route);loadCatalog();route();
</script></body></html>
